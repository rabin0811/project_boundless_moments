<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin - Timeless Memories</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    .hidden { display: none; }
    .small { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">Admin</div>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="gallery.html">Gallery</a>
      <a href="experience.html">Experience</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container admin-panel">
    <div class="sidebar card">
      <h3>Login</h3>
      <div id="loginBox">
        <input id="adminUser" class="input" placeholder="Username">
        <input id="adminPass" class="input" placeholder="Password" type="password">
        <button id="loginBtn" class="btn">Login</button>
        <p id="loginStatus" class="small"></p>
      </div>
      <div id="addPort" class="hidden" style="margin-top:14px">
        <h4>Add Portfolio</h4>
        <form id="portfolioForm" enctype="multipart/form-data">
          <input name="title" class="input" placeholder="Title" required>
          <input name="image" class="input" type="file" accept="image/*">
          <textarea name="description" class="input" rows="4" placeholder="Short description"></textarea>
          <button class="btn" type="submit">Add</button>
        </form>
        <p id="portfolioStatus" class="small"></p>
      </div>
    </div>

    <div id="dashboard" class="card hidden" style="flex:1">
      <h3>Inquiries</h3>
      <ul id="inquiryList" style="list-style:none;padding:0"></ul>
    </div>
  </main>

  <footer class="footer">
    © 2025 Timeless Memories Photography
  </footer>

  <script src="script.js"></script>
  <script>
    // show add portfolio area after login
    const originalLoginHandler = document.getElementById('loginBtn');
    if (originalLoginHandler) {
      originalLoginHandler.addEventListener('click', async () => {
        // after main login logic completes, show add portfolio
        setTimeout(() => {
          if (!document.getElementById('dashboard').classList.contains('hidden')) {
            document.getElementById('addPort').classList.remove('hidden');
          }
        }, 600);
      });
    }
  </script>
</body>
</html>
