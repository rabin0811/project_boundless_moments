<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login for Boundless Moments</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <div class="container" style="max-width:520px;margin-top:80px">
    <div class="card">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <div style="margin:10px 0"><input class="input" name="email" placeholder="Email" required>
        </div>
        <div style="margin:10px 0"><input class="input" name="password" placeholder="Password" type="password" required>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" type="submit">Login</button>
        </div>
      </form>
      <div id="msg" style="color:#f66;margin-top:8px"></div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(this).entries());
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const j = await res.json();
      if (!j.success) {
        document.getElementById('msg').textContent = j.message || 'Login failed';
        return;
      }
      localStorage.setItem('bm_token', j.token);
      localStorage.setItem('bm_name', j.displayName || j.username);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>

</html>
