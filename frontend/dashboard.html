<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard Boundless Moments</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <div class="container" style="margin-top:20px">
    <div class="header">
      <div>
        <h2>Boundless Moments <br> Admin</h2>
        <div id="welcome" class="muted"></div>
      </div>
      <div>
        <button id="logout" class="btn">Logout</button>
      </div>
    </div>

    <section class="card" style="margin-bottom:14px">
      <h3>Upload Portfolio Item</h3>
      <form id="uploadForm">
        <div style="display:flex;gap:8px;align-items:center">
          <input class="input" name="title" placeholder="Title" required>

          <select class="input" name="category" id="categorySelect" required>
            <option value="">Loading...</option>
          </select>

          <input type="file" name="image" accept="image/*" required>
          <button class="btn" type="submit">Upload</button>
        </div>
        <div style="margin-top:8px"><input class="input" name="caption" placeholder="Caption"></div>
      </form>
      <div id="uploadMsg" style="margin-top:8px"></div>
    </section>

    <section class="card" style="margin-bottom:14px">
      <h3>Portfolio Items</h3>
      <div id="portfolioList"></div>
    </section>

    <section class="card">
      <h3>Client Inquiries</h3>
      <div id="inquiryList"></div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>

</html>
