<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio — Boundless Moments</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <nav class="container navbar">
    <div class="brand">
      <div class="logo">BM</div> Boundless Moments
    </div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" class="btn">Contact</a>
    </div>
  </nav>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <h2>Portfolio</h2>
        <p class="muted">Selected projects — click to enlarge</p>
      </div>

      <div class="filters">
        <button class="active" data-filter="all">All</button>
        <button data-filter="Portraits">Portraits</button>
        <button data-filter="Weddings">Weddings</button>
        <button data-filter="Commercial">Commercial</button>
      </div>

      <div id="grid" class="grid"></div>
    </section>
  </main>

  <footer class="container">© <span id="year"></span> Boundless Moments</footer>

  <script src="site.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadPortfolio() {
      const res = await fetch('/api/portfolio');
      const data = await res.json();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      if (!data.success) return grid.innerHTML = '<div class="card">Failed to load</div>';
      data.items.forEach(item => {
        const div = document.createElement('figure');
        div.className = 'grid-item';
        div.dataset.cat = item.Category || 'Uncategorized';
        div.innerHTML = `<span class="pill">${item.Category || 'Uncategorized'}</span>
          <img src="${item.ImageUrl}" alt="${item.Title || ''}">
          <figcaption style="padding:12px"><strong>${item.Title || ''}</strong><p class="muted" style="margin:6px 0 0">${item.Caption || ''}</p></figcaption>`;
        grid.appendChild(div);
      });
      // re-bind filters (site.js's setupFilters looks for .filters and .grid)
      if (typeof setupFilters === 'function') setupFilters();
    }

    loadPortfolio();
  </script>
</body>

</html>
