<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Boundless Moments</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <nav class="container navbar">
    <div class="brand">
      <div class="logo">BM</div> Boundless Moments
    </div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" class="btn">Contact</a>
    </div>
  </nav>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <h2>Contact Us</h2>
        <p class="muted">Tell us about your project</p>
      </div>

      <div class="card">
        <form id="contactForm">
          <div class="form-row">
            <input required name="name" placeholder="Your Name" >
            <input required type="email" name="email" placeholder="Email" />
          </div>
          <div style="margin:12px 0">
            <select name="service" required>
              <option value="">Select Service</option>
              <option>Portraits</option>
              <option>Weddings</option>
              <option>Commercial</option>
            </select>
          </div>
          <textarea name="message" placeholder="Tell us about your project..." required></textarea>
          <div style="margin-top:12px"><button class="btn" type="submit">Send Inquiry</button></div>
          <small class="muted">We will respond within 48 hours.</small>
        </form>
      </div>
    </section>
  </main>

  <footer class="container">© <span id="year"></span> Boundless Moments</footer>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  document.getElementById('contactForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(this).entries());
    const res = await fetch('http://localhost:5000/api/contact', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(data)
});
    const j = await res.json();
    alert(j.message || (j.success ? 'Sent' : 'Failed'));
    if (j.success) this.reset();
  });
</script>

</body>

</html>
